name: Release

# Publish @pdiodsgn/tokens to npm and cut a GitHub Release when a v* tag is pushed.
# The tag must match palladio/package.json "version" (e.g. tag v0.1.0 -> version 0.1.0).
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. One-time setup on
# npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions, repo
# bext1998/palladio-design-language-system, workflow release.yml. The package
# must exist first, so the very first version is published manually
# (`npm login && npm publish --provenance=false` from palladio/).

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: palladio

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: palladio/package-lock.json

      # OIDC trusted publishing needs npm >= 11.5.1; make sure the runner has it.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      - name: Rebuild + validate
        run: npm run rebuild && npm run validate:all

      - name: Committed dist/ must match a fresh build
        run: git diff --exit-code -- dist

      - name: Pack (same tarball that will be published)
        run: npm pack

      - name: Publish to npm (skip if this version is already on the registry)
        # OIDC via id-token: write; provenance is automatic. Idempotent: a
        # version that was hand-published (e.g. the 0.1.0 bootstrap) is skipped
        # so re-tagging or a forgotten version bump does not fail the run.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — skipping npm publish."
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The npm tarball itself — dist/ + bin/ + package.json + README + CHANGELOG + LICENSE.
          files: palladio/*.tgz
          generate_release_notes: true
