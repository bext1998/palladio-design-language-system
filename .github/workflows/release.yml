name: Release

# Publish @palladio/tokens to npm and cut a GitHub Release when a v* tag is pushed.
# The tag must match palladio/package.json "version" (e.g. tag v0.1.0 -> version 0.1.0).

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: palladio

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: palladio/package-lock.json

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      - name: Rebuild + validate
        run: npm run rebuild && npm run validate:all

      - name: Committed dist/ must match a fresh build
        run: git diff --exit-code -- dist

      - name: Pack (same tarball that will be published)
        run: npm pack

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The npm tarball itself — dist/ + bin/ + package.json + README + CHANGELOG + LICENSE.
          files: palladio/*.tgz
          generate_release_notes: true
